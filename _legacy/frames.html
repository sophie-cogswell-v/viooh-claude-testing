<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deal Creation — Figma-frame prototype</title>
  <style>
    :root { --frame-w: 1512; --frame-h: 982; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: #E9EBEE; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; color: #131221; }
    body { display: grid; place-items: center; padding: 20px; }

    .stage {
      width: min(100vw - 40px, 1512px);
      aspect-ratio: var(--frame-w) / var(--frame-h);
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(15,14,46,0.14), 0 4px 12px rgba(15,14,46,0.06);
      background: #fff;
    }
    .stage__img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      user-select: none;
      -webkit-user-drag: none;
    }
    /* Hotspots are % positioned so they scale with the stage.
       Show them in debug mode with ?hs=1 to see where they sit. */
    .hotspot {
      position: absolute;
      background: transparent;
      cursor: pointer;
      border: 0;
      border-radius: 6px;
      transition: background .12s, outline .12s;
    }
    .hotspot:hover {
      background: rgba(75,55,232,0.10);
      outline: 1.5px solid rgba(75,55,232,0.5);
    }
    body.debug .hotspot {
      background: rgba(75,55,232,0.14);
      outline: 1.5px dashed rgba(75,55,232,0.7);
    }
    body.debug .hotspot::after {
      content: attr(data-label);
      position: absolute; top: 2px; left: 6px;
      font-size: 10px; color: #3A28C6; font-weight: 600;
      background: #fff; padding: 1px 4px; border-radius: 3px;
    }

    .toast {
      position: fixed; bottom: 20px; left: 50%;
      transform: translateX(-50%);
      background: #131221; color: #fff;
      padding: 10px 18px; border-radius: 999px;
      font-size: 13px;
      opacity: 0; transition: opacity .18s;
      z-index: 20;
    }
    .toast.is-visible { opacity: 1; }

    .toolbar {
      position: fixed; top: 20px; left: 20px;
      display: flex; gap: 8px; z-index: 30;
    }
    .toolbar button {
      background: #fff; border: 1px solid #E5E8ED;
      border-radius: 999px; padding: 6px 14px;
      font-size: 12px; font-weight: 500; color: #42414E;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(15,14,46,0.06);
    }
    .toolbar button.is-on { background: #EFEDFF; color: #3A28C6; border-color: #6858F0; }

    .breadcrumb {
      position: fixed; top: 20px; right: 20px;
      z-index: 30;
      background: #fff;
      border: 1px solid #E5E8ED;
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 12px;
      color: #42414E;
      box-shadow: 0 2px 6px rgba(15,14,46,0.06);
    }
    .breadcrumb strong { color: #131221; }
  </style>
</head>
<body>

<div class="toolbar">
  <button id="debugToggle">Show hotspots</button>
  <a href="/index.html" style="text-decoration:none"><button>Legacy layout</button></a>
</div>

<div class="breadcrumb">Frame: <strong id="crumb">ng-01-empty</strong></div>

<div class="stage" id="stage">
  <img class="stage__img" id="frameImg" alt="Figma frame" />
  <!-- Hotspots injected here by JS -->
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// ===========================================================================
// Frame catalogue.
// Each entry pins a downloaded PNG (exported from Figma) with the frame's
// native dimensions and an ordered list of hotspots: rectangles in % of the
// frame that call an action when clicked. Zero styling reinvention here —
// what you see is literally the Figma export.
// ===========================================================================

const FRAMES = {
  'ng-01-empty': {
    src: 'assets/frames/ng-01-empty.png',
    w: 1512, h: 982,
    hotspots: [
      { x: 4.4,  y: 51.4, w: 21.5, h: 4.8, label: 'Skip',       to: 'ng-02-deal-environment' },
      { x: 84.7, y: 0.7,  w: 6.6,  h: 3.5, label: 'Map',        to: 'ng-map-01-empty' },
      { x: 78.4, y: 1.0,  w: 6.6,  h: 3.0, label: 'Overview',   to: 'ng-01-empty',  toastCopy: 'Already on Overview' },
      { x: 4.7,  y: 21.6, w: 8.0,  h: 3.6, label: 'NG Floor',   to: 'ng-01-empty',  toastCopy: 'NG Floor selected' },
      { x: 12.7, y: 21.6, w: 8.0,  h: 3.6, label: 'NG Fixed',   to: 'ng-01-empty',  toastCopy: 'NG Fixed selected' },
      { x: 20.7, y: 21.6, w: 6.0,  h: 3.6, label: 'PG',         to: 'ng-01-empty',  toastCopy: 'For PG a Continue button appears in place of Skip' },
    ],
  },
  'ng-02-deal-environment': {
    src: 'assets/frames/ng-02-deal-environment.png',
    w: 1512, h: 982,
    hotspots: [
      { x: 41.9, y: 62.1, w: 5.3,  h: 4.8, label: 'Cancel', to: 'ng-01-empty' },
      { x: 61.2, y: 62.1, w: 5.3,  h: 4.8, label: 'Next',   to: 'ng-01-empty', toastCopy: 'Environment saved — continue to DSP / CPM in the full prototype' },
      { x: 84.7, y: 0.7,  w: 6.6,  h: 3.5, label: 'Map',    to: 'ng-map-01-empty' },
    ],
  },
  'ng-map-01-empty': {
    src: 'assets/frames/ng-map-01-empty.png',
    w: 1620, h: 982,
    hotspots: [
      { x: 79.3, y: 0.7, w: 7.2, h: 3.5, label: 'Overview', to: 'ng-01-empty' },
      { x: 4.4,  y: 46.8, w: 20.1, h: 4.8, label: 'Skip',    to: 'ng-02-deal-environment' },
    ],
  },
};

const state = { frame: 'ng-01-empty' };
const stage = document.getElementById('stage');
const img = document.getElementById('frameImg');
const crumb = document.getElementById('crumb');
const toastEl = document.getElementById('toast');

function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('is-visible');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toastEl.classList.remove('is-visible'), 2000);
}

function render() {
  const frame = FRAMES[state.frame];
  img.src = frame.src;
  crumb.textContent = state.frame;
  stage.style.setProperty('--frame-w', frame.w);
  stage.style.setProperty('--frame-h', frame.h);
  stage.style.aspectRatio = frame.w + ' / ' + frame.h;

  // Wipe existing hotspots and rebuild
  stage.querySelectorAll('.hotspot').forEach(el => el.remove());
  frame.hotspots.forEach(spot => {
    const btn = document.createElement('button');
    btn.className = 'hotspot';
    btn.setAttribute('aria-label', spot.label);
    btn.dataset.label = spot.label;
    btn.style.left   = spot.x + '%';
    btn.style.top    = spot.y + '%';
    btn.style.width  = spot.w + '%';
    btn.style.height = spot.h + '%';
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (spot.toastCopy) toast(spot.toastCopy);
      if (spot.to && spot.to !== state.frame) {
        state.frame = spot.to;
        render();
        return;
      }
      if (!spot.toastCopy) toast(spot.label + ' clicked');
    });
    stage.appendChild(btn);
  });
}

document.getElementById('debugToggle').addEventListener('click', function () {
  document.body.classList.toggle('debug');
  this.classList.toggle('is-on', document.body.classList.contains('debug'));
  this.textContent = document.body.classList.contains('debug') ? 'Hide hotspots' : 'Show hotspots';
});

// URL param ?hs=1 auto-enables debug so you can inspect on load
if (new URLSearchParams(location.search).get('hs') === '1') {
  document.getElementById('debugToggle').click();
}

render();
</script>
</body>
</html>
